<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Azure Function - TP5</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input, button { margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { background-color: #0078D4; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #005a9e; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Addition Serverless</h2>
    <label for="num1">Nombre 1 :</label>
    <input type="number" id="num1" placeholder="Ex: 5">

    <label for="num2">Nombre 2 :</label>
    <input type="number" id="num2" placeholder="Ex: 10">

    <button onclick="calculer()">Calculer</button>

    <div id="result"></div>
</div>

<script>
async function calculer() {
    const num1 = document.getElementById('num1').value;
    const num2 = document.getElementById('num2').value;
    const resultDiv = document.getElementById('result');

    // Remplacez l'URL ci-dessous par votre URL complète Azure incluant le paramètre ?code=...
    const url = "...";

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ num1: Number(num1), num2: Number(num2) })
        });

        const data = await response.text();
        resultDiv.style.color = "green";
        resultDiv.innerText = "Résultat : " + data;
    } catch (error) {
        resultDiv.style.color = "red";
        resultDiv.innerText = "Erreur : " + error;
    }
}
</script>

</body>
</html>
